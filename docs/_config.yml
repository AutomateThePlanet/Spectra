title: SPECTRA
description: AI-native test generation and execution framework
theme: just-the-docs
url: https://automatetheplanet.github.io
baseurl: /Spectra

# Branding
logo: /assets/images/spectra-logo.svg
favicon_ico: /assets/images/spectra-mark.svg

# Color scheme (custom ATP brand)
color_scheme: spectra

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false   # the search lives in the ATP header (_includes/atp_header.html)

# Code blocks: copy button, collapse and colours come from the shared assets/js/codeblock.js
enable_copy_code_button: false

# Navigation
nav_sort: case_insensitive

# Table of contents
heading_anchors: true

# Footer
footer_content: 'SPECTRA is part of the <a href="https://www.automatetheplanet.com/">Automate The Planet</a> ecosystem. Licensed under the <a href="https://github.com/AutomateThePlanet/Spectra/blob/main/LICENSE">Apache License 2.0</a>.'

# Download links: shown as "Get SPECTRA" in the home page heading band (_includes/spectra_hero.html)
aux_links:
  "NuGet (Spectra.CLI)":
    - "https://www.nuget.org/packages/Spectra.CLI"
  "GitHub":
    - "https://github.com/AutomateThePlanet/Spectra"
  "GitHub Releases":
    - "https://github.com/AutomateThePlanet/Spectra/releases"

aux_links_new_tab: true

# "Edit this page" link
gh_edit_repository: https://github.com/AutomateThePlanet/Spectra
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Sass: just-the-docs 0.12.0 still uses @import, darken()/lighten() and global built-in
# functions, which Dart Sass reports as deprecations on every build. Our own SCSS uses @use
# and the sass:color module, so silencing these three categories hides only the theme gem.
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-sitemap

# jekyll-relative-links: rewrite relative *.md links to their built
# *.html counterparts so cross-doc references work on the deployed site.
relative_links:
  enabled: true
  collections: true

# Default layout for every page (Just the Docs sidebar + header)
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Exclude machine-generated files & build artifacts from the site
exclude:
  - "criteria/"
  - "_index.md"
  - "_index.yaml"
  - "_index.json"
  - "**/*.criteria.yaml"
  - "_criteria_index.yaml"
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor/"
  - "node_modules/"
  - "scripts/"
  - "contributing/"
