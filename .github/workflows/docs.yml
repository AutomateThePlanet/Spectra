name: Deploy Documentation

# One-time manual setup required:
#   Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Pinned: Playwright 1.56.1 (contrast check) cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Colour contrast (axe-core, WCAG AA) on every page at 1440 and 390 px. Warn only for now:
      # failures show as warning annotations on the run and never block the deploy.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Installing the checker must work: a failure here fails the job.
      - name: Install contrast checker and Chromium
        working-directory: docs/scripts/a11y
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check colour contrast (warn only)
        continue-on-error: true
        working-directory: docs/scripts/a11y
        run: node check-contrast.js ../../_site --base "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
